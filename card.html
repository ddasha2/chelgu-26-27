<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/card.css">
</head>
<body>
    <div class="product-card">
        <div class="card-top">
            <img class="card-top__image" src="assets/images/product.png" />
        </div>

        <div class="product-card__content">
            <span class="product-card__title">Volcanic Chocolate</span>
        
            <ul class="product-card__tags">
                <li>CHOCOLATE</li>
                <li>VANILLA</li>
                <li>ORGANIC</li>
            </ul>

            <div class="regular-text">
                Bitter chocolate with sweet vanilla, an extremely unique spicy taste hidden in the choux cake.
            </div>

            <div class="product-card__cake-structure">
                <span class="product-card__structure-label">Cake included</span>
                <ul class="product-card__structure-tags">
                    <li class="product-card__structure-tag product-card__structure-tag_dark">Chocolates</li>
                    <li class="product-card__structure-tag product-card__structure-tag_orange">Beans</li>
                    <li class="product-card__structure-tag product-card__structure-tag_yellow">Butter</li>
                </ul>
            </div>

            <div class="product-card__counter">
                <button class="product-card__counter-btn">-</button>
                <input type="text" class="product-card__counter-input" value="1" readonly>
                <button class="product-card__counter-btn">+</button>
            </div>

            <div class="product-card__action">
                <div class="product-card__action-pricing">
                    <span class="product-card__price">820.000 vnd</span>
                    <span class="product-card__delivery">50.000 vnd delivery</span>
                </div>

                <button class="product-card__button">Add to cart</button>
                
            </div>
        </div>    
    </div>
</body>
</html>
